name: coral lineageos with resukisu

on:
  workflow_dispatch:
    inputs:
      base_img_url:
        description: "Direct download URL for LineageOS 23.2 base boot.img"
        required: true
        type: string
        default: "https://mirrorbits.lineageos.org/full/coral/20260904/boot.img"

jobs:
  build-resukisu-coral-4-14:
    runs-on: ubuntu-22.04

    steps:
      - name: Free runner space
        uses: justinthelaw/maximize-github-runner-space@v0.12.3
        with:
          swapfile-size: 30GiB

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison libssl-dev libelf-dev \
            libncurses5-dev make zip git curl python3 bc cpio lz4

      - name: Clone AOSP mkbootimg Tools
        run: |
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg_tools

      - name: Clone LineageOS 4.14 Kernel Source
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_google_msm-4.14 -b lineage-23.2 kernel_src

      - name: Download Base boot.img
        run: |
          echo "=== Downloading base boot.img ==="
          curl -fSL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o base.img \
            "${{ inputs.base_img_url }}"
          ls -la base.img

      - name: Extract KERNELRELEASE from Base boot.img
        run: |
          echo "=== Extracting stock vermagic directly from base.img ==="
          mkdir -p base_unpacked
          python3 mkbootimg_tools/unpack_bootimg.py --boot_img base.img --out base_unpacked
          lz4 -dc base_unpacked/kernel > /tmp/base_Image
          STOCK_RELEASE=$(strings /tmp/base_Image | grep -E "Linux version [0-9]" | head -n 1 | awk '{print $3}')
          echo "Extracted Stock KERNELRELEASE: $STOCK_RELEASE"
          test -n "$STOCK_RELEASE" || { echo "::error::Failed to extract vermagic from base.img"; exit 1; }
          echo "STOCK_RELEASE=$STOCK_RELEASE" >> $GITHUB_ENV

      - name: Setup Clang r416183b
        run: |
          mkdir -p clang
          echo "=== Downloading Clang r416183b ==="
          curl -fSL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2021/clang-r416183b.tar.gz"
          echo "=== Extracting Clang ==="
          tar -xzf clang.tar.gz -C clang
          test -x clang/bin/clang || { echo "::error::clang archive was invalid or empty"; exit 1; }
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"
          clang/bin/clang --version

      - name: Setup ReSukiSU Driver
        run: |
          cd kernel_src
          echo "=== Adding ReSukiSU (Main Branch for v4.2.0-rc1) ==="
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git
          
          # Symlink the kernel driver
          cd drivers
          ln -sf ../ReSukiSU/kernel kernelsu
          cd ..
          
          # Register in Makefile and Kconfig
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig

      - name: Apply ReSukiSU Verified Manual Hooks
        run: |
          cd kernel_src
          echo "=== Applying verified manual hooks using Python ==="
          python3 - << 'EOF'
          # 1. fs/exec.c
          with open('fs/exec.c', 'r') as f:
              content = f.read()

          target = """static int do_execveat_common(int fd, struct filename *filename,
          			      struct user_arg_ptr argv,
          			      struct user_arg_ptr envp,
          			      int flags)
          {
          	return __do_execve_file(fd, filename, argv, envp, flags, NULL);
          }"""

          replacement = """#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
          				void *argv, void *envp, int *flags);
          #endif

          static int do_execveat_common(int fd, struct filename *filename,
          			      struct user_arg_ptr argv,
          			      struct user_arg_ptr envp,
          			      int flags)
          {
          #ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          #endif
          	return __do_execve_file(fd, filename, argv, envp, flags, NULL);
          }"""

          assert target in content, "Failed to locate target in fs/exec.c"
          content = content.replace(target, replacement, 1)
          with open('fs/exec.c', 'w') as f:
              f.write(content)
          print("✅ fs/exec.c hooked")

          # 2. fs/open.c
          with open('fs/open.c', 'r') as f:
              content = f.read()

          target = """SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
          {
          	const struct cred *old_cred;
          	struct cred *override_cred;
          	struct path path;
          	struct inode *inode;
          	struct vfsmount *mnt;
          	int res;
          	unsigned int lookup_flags = LOOKUP_FOLLOW;

          	if (mode & ~S_IRWXO)"""

          replacement = """#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
          				int *mode, int *flags);
          #endif

          SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
          {
          	const struct cred *old_cred;
          	struct cred *override_cred;
          	struct path path;
          	struct inode *inode;
          	struct vfsmount *mnt;
          	int res;
          	unsigned int lookup_flags = LOOKUP_FOLLOW;

          #ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif

          	if (mode & ~S_IRWXO)"""

          assert target in content, "Failed to locate target in fs/open.c"
          content = content.replace(target, replacement, 1)
          with open('fs/open.c', 'w') as f:
              f.write(content)
          print("✅ fs/open.c hooked")

          # 3. fs/stat.c
          with open('fs/stat.c', 'r') as f:
              content = f.read()

          target1 = """#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)
          SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
          		struct stat __user *, statbuf, int, flag)
          {
          	struct kstat stat;
          	int error;

          	error = vfs_fstatat(dfd, filename, &stat, flag);"""

          replacement1 = """#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user,
          				int *flags);
          extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);
          #endif
          #endif

          #if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)
          SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
          		struct stat __user *, statbuf, int, flag)
          {
          	struct kstat stat;
          	int error;

          #ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_stat(&dfd, &filename, &flag);
          #endif

          	error = vfs_fstatat(dfd, filename, &stat, flag);"""

          target2 = """SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)
          {
          	struct kstat stat;
          	int error = vfs_fstat(fd, &stat);

          	if (!error)
          		error = cp_new_stat(&stat, statbuf);

          	return error;
          }"""

          replacement2 = """SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)
          {
          	struct kstat stat;
          	int error = vfs_fstat(fd, &stat);

          	if (!error)
          		error = cp_new_stat(&stat, statbuf);

          #ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_newfstat_ret(&fd, &statbuf);
          #endif

          	return error;
          }"""

          assert target1 in content, "Failed to locate target1 in fs/stat.c"
          assert target2 in content, "Failed to locate target2 in fs/stat.c"
          content = content.replace(target1, replacement1, 1).replace(target2, replacement2, 1)
          with open('fs/stat.c', 'w') as f:
              f.write(content)
          print("✅ fs/stat.c hooked")

          # 4. kernel/reboot.c
          with open('kernel/reboot.c', 'r') as f:
              content = f.read()

          target = """SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
          		void __user *, arg)
          {
          	struct pid_namespace *pid_ns = task_active_pid_ns(current);
          	char buffer[256];
          	int ret = 0;"""

          replacement = """#ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
          #endif

          SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
          		void __user *, arg)
          {
          	struct pid_namespace *pid_ns = task_active_pid_ns(current);
          	char buffer[256];
          	int ret = 0;

          #ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          #endif"""

          assert target in content, "Failed to locate target in kernel/reboot.c"
          content = content.replace(target, replacement, 1)
          with open('kernel/reboot.c', 'w') as f:
              f.write(content)
          print("✅ kernel/reboot.c hooked")
          EOF

      - name: Bypass Vendor Module CRC Check (Fix Vendor Module Loading)
        run: |
          cd kernel_src
          echo "=== Allowing vendor modules to load despite compiler CRC difference ==="
          sed -i '/bad_version:/,/return 0;/s/return 0;/return 1;/' kernel/module.c

      - name: Fix Driver Include Paths
        run: |
          cd kernel_src
          echo "=== Fixing driver include syntax for standalone Clang compilation ==="
          # 1. Camera Floral Tracepoint Path
          sed -i "1i ccflags-y += -I\$(src)" drivers/media/platform/msm/camera_floral/cam_utils/Makefile

          # 2. Battery driver angled includes -> quoted includes
          sed -i 's/<google\/google_bms.h>/"google\/google_bms.h"/' drivers/power/supply/max1720x_battery.c
          sed -i 's/<google\/logbuffer.h>/"google\/logbuffer.h"/' drivers/power/supply/max1720x_battery.c

          # 3. IPA v3 driver missing parent include directory
          sed -i "1i ccflags-y += -I\$(srctree)/drivers/platform/msm/ipa/ipa_v3" drivers/platform/msm/ipa/ipa_v3/Makefile

          # 4. Fix relative angled includes (<../...>) across all drivers
          grep -rlE '#include <\.\./' drivers/ | xargs sed -i -E 's|#include <(\.\./[^>]+)>|#include "\1"|g'

      - name: Configure ReSukiSU Kernel
        run: |
          cd kernel_src
          echo "=== Generating base .config from floral_defconfig ==="
          make -j"$(nproc)" ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            floral_defconfig

          echo "=== Setting ReSukiSU kernel options via scripts/config ==="
          ./scripts/config --file .config -e KSU
          ./scripts/config --file .config -e KSU_MANUAL_HOOK
          ./scripts/config --file .config -d KSU_WITH_KPROBES
          
          # Auto-hooks for kernels < 6.8 (handles setuid, initrc, and input via LSM)
          ./scripts/config --file .config -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK
          ./scripts/config --file .config -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK
          ./scripts/config --file .config -e KSU_MANUAL_HOOK_AUTO_INPUT_HOOK

          ./scripts/config --file .config -d CC_WERROR
          ./scripts/config --file .config -e OVERLAY_FS
          ./scripts/config --file .config -e KALLSYMS
          ./scripts/config --file .config -e KALLSYMS_ALL

          # Enforce exact stock vermagic
          echo "${{ env.STOCK_RELEASE }}" > .scmversion
          mkdir -p include/config
          echo "${{ env.STOCK_RELEASE }}" > include/config/kernel.release

          echo "=== Updating and verifying .config with olddefconfig ==="
          make -j"$(nproc)" ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

      - name: Build ReSukiSU Kernel Binary (Image.lz4)
        run: |
          cd kernel_src
          echo "=== Compiling ReSukiSU Image.lz4 with pure LLVM ==="
          make -j"$(nproc)" ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            KERNELRELEASE="${{ env.STOCK_RELEASE }}" \
            Image.lz4

          echo "=== Verifying KernelSU strings in compiled vmlinux ==="
          if strings vmlinux | grep -i -q "kernelsu"; then
            echo "✅ ReSukiSU symbols/strings found in vmlinux!"
          else
            echo "❌ ERROR: No KernelSU strings found in the compiled binary!"
            exit 1
          fi

      - name: Repack ReSukiSU boot.img
        run: |
          set -e
          mkdir -p out_artifacts unpacked
          
          IMAGE_LZ4=$(find kernel_src/arch/arm64/boot -name "Image.lz4" | head -n 1)
          test -f "$IMAGE_LZ4" || { echo "::error::Image.lz4 not found!"; exit 1; }
          cp "$IMAGE_LZ4" out_artifacts/Image.lz4

          echo "=== Unpacking original boot.img ==="
          ARGS=$(python3 mkbootimg_tools/unpack_bootimg.py \
            --boot_img base.img \
            --out unpacked \
            --format mkbootimg)

          echo "=== Substituting newly compiled kernel ==="
          NEW_ARGS=$(echo "$ARGS" | sed -E "s#--kernel [^ ]+#--kernel out_artifacts/Image.lz4#")

          echo "=== Repacking boot.img ==="
          eval "python3 mkbootimg_tools/mkbootimg.py $NEW_ARGS --output out_artifacts/boot.img"

          test -f out_artifacts/boot.img || { echo "::error::Failed to create repacked boot.img"; exit 1; }
          echo "Successfully created ReSukiSU boot.img"

      - name: Upload ReSukiSU boot.img Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coral-resukisu-only
          path: out_artifacts/*
          if-no-files-found: error

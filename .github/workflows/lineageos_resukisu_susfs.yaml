name: coral lineageos with resukisu susfs

on:
  workflow_dispatch:
    inputs:
      base_img_url:
        description: "Direct download URL for LineageOS 23.2 base boot.img"
        required: true
        type: string
        default: "https://mirrorbits.lineageos.org/full/coral/20260904/boot.img"

jobs:
  build-resukisu-coral-4-14:
    runs-on: ubuntu-22.04

    steps:
      - name: Free runner space
        uses: justinthelaw/maximize-github-runner-space@v0.12.3
        with:
          swapfile-size: 30GiB

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison libssl-dev libelf-dev \
            libncurses5-dev make zip git curl python3 bc cpio lz4 patch

      - name: Clone AOSP mkbootimg Tools
        run: |
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg_tools

      - name: Clone LineageOS 4.14 Kernel Source
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_google_msm-4.14 -b lineage-23.2 kernel_src

      - name: Apply ptrace_stop Backport Patch
        run: |
          cd kernel_src
          echo "=== Applying ptrace_stop backport patch ==="
          curl -fSL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            https://github.com/sidex15/android_kernel_lge_sm8150/commit/fcc59dc3310d3a1511d02dc3ac6d1e113517ece1.patch \
            | patch -p1

          # Verify no rejected hunks exist
          REJ_COUNT=$(find . -name "*.rej" | wc -l)
          if [ "$REJ_COUNT" -ne 0 ]; then
            echo "::error::Found $REJ_COUNT rejected patch files in ptrace_stop patch!"
            find . -name "*.rej" -exec cat {} +
            exit 1
          fi
          echo "✅ ptrace_stop backport patch applied cleanly with 0 rejects."

      - name: Download Base boot.img
        run: |
          echo "=== Downloading base boot.img ==="
          curl -fSL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o base.img \
            "${{ inputs.base_img_url }}"
          ls -la base.img

      - name: Extract KERNELRELEASE from Base boot.img
        run: |
          echo "=== Extracting stock vermagic directly from base.img ==="
          mkdir -p base_unpacked
          python3 mkbootimg_tools/unpack_bootimg.py --boot_img base.img --out base_unpacked
          lz4 -dc base_unpacked/kernel > /tmp/base_Image
          STOCK_RELEASE=$(strings /tmp/base_Image | grep -E "Linux version [0-9]" | head -n 1 | awk '{print $3}')
          echo "Extracted Stock KERNELRELEASE: $STOCK_RELEASE"
          test -n "$STOCK_RELEASE" || { echo "::error::Failed to extract vermagic from base.img"; exit 1; }
          echo "STOCK_RELEASE=$STOCK_RELEASE" >> $GITHUB_ENV

      - name: Setup Clang r416183b
        run: |
          mkdir -p clang
          echo "=== Downloading Clang r416183b ==="
          curl -fSL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2021/clang-r416183b.tar.gz"
          echo "=== Extracting Clang ==="
          tar -xzf clang.tar.gz -C clang
          test -x clang/bin/clang || { echo "::error::clang archive was invalid or empty"; exit 1; }
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"
          clang/bin/clang --version

      - name: Clone NonGKI SuSFS Patches
        run: |
          git clone --depth=1 https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git nongki_build

      - name: Apply SuSFS Kernel Patches
        run: |
          cd kernel_src
          echo "=== Adapting and applying SuSFS 4.14 kernel patch ==="
          # 1. Adapt vfs_open signature in patch from 3 params to 2 params for 4.14 kernel
          sed 's/error = vfs_open(&path, file, current_cred());/error = vfs_open(\&path, file);/g' \
            ../nongki_build/Patches/Patch/susfs_patch_to_4.14.patch > /tmp/susfs_4.14_coral.patch

          # 2. Add missing context include in fs/proc/task_mmu.c
          sed -i '/#include <linux\/mm_inline.h>/a#include <linux\/ctype.h>' fs/proc/task_mmu.c

          # 3. Apply kernel patch
          patch -p1 < /tmp/susfs_4.14_coral.patch

          # 4. Verify no rejected hunks exist
          REJ_COUNT=$(find . -name "*.rej" | wc -l)
          if [ "$REJ_COUNT" -ne 0 ]; then
            echo "::error::Found $REJ_COUNT rejected patch files!"
            find . -name "*.rej" -exec cat {} +
            exit 1
          fi
          echo "✅ SuSFS kernel patch applied cleanly with 0 rejects."

          # 5. Fix AOSP vold peer ID mount gap in show_mountinfo
          python3 -c '
          with open("fs/proc_namespace.c", "r") as f:
              content = f.read()

          target = "static int show_mountinfo(struct seq_file *m, struct vfsmount *mnt)\n{"
          replacement = target + """
          \tstruct mount *r = real_mount(mnt);
          \tif (!susfs_is_current_ksu_domain()) {
          \t\tif (r->mnt_mountpoint && !strcmp(r->mnt_mountpoint->d_name.name, "obb")) {
          \t\t\tstruct mount *m_p = r->mnt_parent;
          \t\t\twhile (m_p && m_p != m_p->mnt_parent) {
          \t\t\t\tif (m_p->mnt_mountpoint && !strcmp(m_p->mnt_mountpoint->d_name.name, "androidwritable"))
          \t\t\t\t\treturn 0;
          \t\t\t\tm_p = m_p->mnt_parent;
          \t\t\t}
          \t\t}
          \t}"""

          if target in content:
              content = content.replace(target, replacement, 1)
              with open("fs/proc_namespace.c", "w") as f:
                  f.write(content)
              print("✅ Successfully patched show_mountinfo in fs/proc_namespace.c")
          else:
              print("❌ Error: Target show_mountinfo not found in fs/proc_namespace.c")
              exit(1)
          '
          git diff fs/proc_namespace.c

      - name: Setup ReSukiSU Driver
        run: |
          cd kernel_src
          echo "=== Adding ReSukiSU (Main Branch for v4.2.0-rc1) ==="
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git
          
          # Symlink the kernel driver
          cd drivers
          ln -sf ../ReSukiSU/kernel kernelsu
          cd ..
          
          # Register in Makefile and Kconfig
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig

      - name: Apply SuSFS Inline Hooks
        run: |
          cd kernel_src
          echo "=== Applying SuSFS inline hooks ==="
          # Must run after drivers/kernelsu is symlinked so ksu_handle_setresuid is hooked
          bash ../nongki_build/Patches/susfs_inline_hook_patches.sh
          echo "✅ SuSFS inline hooks applied."

      - name: Bypass Vendor Module CRC Check (Fix Vendor Module Loading)
        run: |
          cd kernel_src
          echo "=== Allowing vendor modules to load despite compiler CRC difference ==="
          sed -i '/bad_version:/,/return 0;/s/return 0;/return 1;/' kernel/module.c

      - name: Fix Driver Include Paths
        run: |
          cd kernel_src
          echo "=== Fixing driver include syntax for standalone Clang compilation ==="
          # 1. Camera Floral Tracepoint Path
          sed -i "1i ccflags-y += -I\$(src)" drivers/media/platform/msm/camera_floral/cam_utils/Makefile

          # 2. Battery driver angled includes -> quoted includes
          sed -i 's/<google\/google_bms.h>/"google\/google_bms.h"/' drivers/power/supply/max1720x_battery.c
          sed -i 's/<google\/logbuffer.h>/"google\/logbuffer.h"/' drivers/power/supply/max1720x_battery.c

          # 3. IPA v3 driver missing parent include directory
          sed -i "1i ccflags-y += -I\$(srctree)/drivers/platform/msm/ipa/ipa_v3" drivers/platform/msm/ipa/ipa_v3/Makefile

          # 4. Fix relative angled includes (<../...>) across all drivers
          grep -rlE '#include <\.\./' drivers/ | xargs sed -i -E 's|#include <(\.\./[^>]+)>|#include "\1"|g'

      - name: Configure ReSukiSU + SuSFS Kernel
        run: |
          cd kernel_src
          echo "=== Generating base .config from floral_defconfig ==="
          make -j"$(nproc)" ARCH=arm64 \
            CC=clang HOSTCC=clang HOSTCXX=clang++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            floral_defconfig

          echo "=== Setting ReSukiSU + SuSFS kernel options via scripts/config ==="
          ./scripts/config --file .config -e KSU
          ./scripts/config --file .config -d KSU_WITH_KPROBES
          ./scripts/config --file .config -d KSU_MANUAL_HOOK

          # SuSFS configuration
          ./scripts/config --file .config -e KSU_SUSFS
          ./scripts/config --file .config -e KSU_SUSFS_SUS_PATH
          ./scripts/config --file .config -e KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file .config -e KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file .config -e KSU_SUSFS_SPOOF_UNAME
          ./scripts/config --file .config -e KSU_SUSFS_ENABLE_LOG
          ./scripts/config --file .config -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ./scripts/config --file .config -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          ./scripts/config --file .config -e KSU_SUSFS_OPEN_REDIRECT
          ./scripts/config --file .config -e KSU_SUSFS_SUS_MAP

          ./scripts/config --file .config -d CC_WERROR
          ./scripts/config --file .config -e OVERLAY_FS
          ./scripts/config --file .config -e TMPFS_XATTR
          ./scripts/config --file .config -e KALLSYMS
          ./scripts/config --file .config -e KALLSYMS_ALL

          # Enforce exact stock vermagic
          echo "${{ env.STOCK_RELEASE }}" > .scmversion
          mkdir -p include/config
          echo "${{ env.STOCK_RELEASE }}" > include/config/kernel.release

          echo "=== Updating and verifying .config with olddefconfig ==="
          make -j"$(nproc)" ARCH=arm64 \
            CC=clang HOSTCC=clang HOSTCXX=clang++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

          echo "=== Verifying SuSFS config in final .config ==="
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_TMPFS_XATTR" .config

      - name: Build ReSukiSU + SuSFS Kernel Binary (Image.lz4)
        run: |
          cd kernel_src
          echo "=== Compiling ReSukiSU + SuSFS Image.lz4 with pure LLVM ==="
          make -j"$(nproc)" ARCH=arm64 \
            CC=clang HOSTCC=clang HOSTCXX=clang++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            KERNELRELEASE="${{ env.STOCK_RELEASE }}" \
            Image.lz4

          echo "=== Verifying KernelSU and SuSFS strings in compiled vmlinux ==="
          if strings vmlinux | grep -i -q "kernelsu"; then
            echo "✅ ReSukiSU symbols/strings found in vmlinux!"
          else
            echo "❌ ERROR: No KernelSU strings found in the compiled binary!"
            exit 1
          fi

          if strings vmlinux | grep -i -q "susfs"; then
            echo "✅ SuSFS symbols/strings found in vmlinux!"
          else
            echo "❌ ERROR: No SuSFS strings found in the compiled binary!"
            exit 1
          fi

      - name: Repack ReSukiSU + SuSFS boot.img
        run: |
          set -e
          mkdir -p out_artifacts unpacked
          
          IMAGE_LZ4=$(find kernel_src/arch/arm64/boot -name "Image.lz4" | head -n 1)
          test -f "$IMAGE_LZ4" || { echo "::error::Image.lz4 not found!"; exit 1; }
          cp "$IMAGE_LZ4" out_artifacts/Image.lz4

          echo "=== Unpacking original boot.img ==="
          ARGS=$(python3 mkbootimg_tools/unpack_bootimg.py \
            --boot_img base.img \
            --out unpacked \
            --format mkbootimg)

          echo "=== Substituting newly compiled kernel ==="
          NEW_ARGS=$(echo "$ARGS" | sed -E "s#--kernel [^ ]+#--kernel out_artifacts/Image.lz4#")

          echo "=== Repacking boot.img ==="
          eval "python3 mkbootimg_tools/mkbootimg.py $NEW_ARGS --output out_artifacts/boot.img"

          test -f out_artifacts/boot.img || { echo "::error::Failed to create repacked boot.img"; exit 1; }
          echo "Successfully created ReSukiSU + SuSFS boot.img"

      - name: Upload ReSukiSU + SuSFS boot.img Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coral-resukisu-susfs
          path: out_artifacts/*
          if-no-files-found: error
